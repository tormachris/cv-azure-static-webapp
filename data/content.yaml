name: Kristof Torma
address: Budapest, Hungary
email: iam@tormakristof.eu

sections:
  - heading: Summary
    body: Technical lead and Scrum Master in DevOps and infrastructure at Nokia, working with Kubernetes, infrastructure as code and multi-cloud platforms, and building in-house AI tooling for engineering organizations from code review agents to adoption metrics.

  - heading: Experience
    subsections:
    - heading:
        label: Technical Lead and Scrum Master @ Nokia
        startdate: February 2024
      points:
      - Built an in-house AI code review agent that undercut commercial tooling on cost, and rolled it out across multiple organizations.
      - Built a tool that visualizes AI-assisted code usage, after evaluating git-native approaches to attributing it.
      - Lead a DevOps team that has varied between 6 and 12 engineers.
      - Established and now lead an internal Infra Team that owns the testing and development labs.
      - Introduced the gating that gives QA one validated product build per day.
      - Took part in building out the R&D organization, onboarding new teams and formalizing its processes as it grew.
      - Co-authored the code review standards and the scope and change management processes with QA and product stakeholders.
    - heading:
        label: DevOps Engineer @ Nokia
        startdate: March 2022
        enddate: February 2024
      points:
      - Designed and implemented an internal API that provisions Kubernetes clusters on AWS and Azure via Pulumi.
      - Cut monthly AWS spend by 36% through a recurring cleanup of unused resources.
      - Built self-service tooling for routine infrastructure tasks, taking the DevOps team out of the critical path for developer requests.
      - Simplified lab infrastructure and developed automations that cut about 7 hours per week of manual maintenance.
      - Resolved Kubernetes issues and built Kubernetes competence across the developer teams.
      - Rewrote the developer documentation so new joiners could set up their environment without pairing with an existing engineer.
    - heading:
        label: Group Lead @ KSZK, Schonherz Dormitory, BME
        startdate: February 2020
        enddate: February 2022
      points:
        - Led KSZK, the roughly 50-member student IT group that runs the dormitory's network and server infrastructure.
        - Set the group's technical direction, facilitated its meetings and introduced DevOps practices to the community.
        - Brought the wider dormitory's requirements into the group and advocated for the group's needs in budget negotiations.
        - Ran semesterly performance reviews for the group's roughly 50 members.
        - Administered the mailing list server processing over 2,000 emails a day and ran mission-critical services including Hyper-V and Kubernetes.
        - Migrated the dormitory's mail infrastructure to Exchange Online and its public-facing DNS zones to a managed cloud provider.
    - heading:
        label: Research Assistant @ Budapest University of Technology and Economics
        startdate: February 2020
        enddate: January 2022
      points:
        - Created a Kubernetes-native system in a 5G network capable of identifying bird song.
        - Adapted the system to an edge-computing environment and identified its performance bottlenecks.
    - heading:
        label: Research Intern @ Ericsson
        startdate: June 2019
        enddate: August 2019
      points:
        - Built a TOSCA parser and integrated it with Ericsson's in-house infrastructure.
        - Deployed Python web applications on Docker-based infrastructure.

  - heading: Skills
    points:
      - AI-assisted development and in-house AI tooling built on Claude, Cursor, GitHub Copilot and Perplexity
      - Kubernetes and OpenShift, with Helm for packaging and deployment
      - Infrastructure as code with Terraform, Pulumi and Ansible
      - CI/CD with Jenkins, Drone, GitHub Actions and GitLab CI
      - AWS, Azure and on-prem cloud platforms
      - Python for automation, internal tooling and Flask microservices
      - Cisco, Juniper and Arista network administration on Linux-based infrastructure
      - Hyper-V and KVM virtualization
      - Scrum facilitation and technical leadership of engineering teams

  - heading: Community
    points:
      - Organize Ctrl-Alt-GG, a bilingual Hungarian and English gaming community in Budapest.
      - Run LAN party events of roughly 50 attendees, building the event network, game servers and supporting services.

  - heading: Languages
    points:
      - Hungarian (native)
      - English (fluent)

  - heading: Education
    subsections:
