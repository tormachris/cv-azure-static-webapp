name: Kristof Torma
address: Budapest, Hungary
email: iam@tormakristof.eu

sections:
  - heading: Summary
    body: Scrum Master and technical lead in DevOps and infrastructure at Nokia, working with Kubernetes, infrastructure as code and multi-cloud platforms.

  - heading: Experience
    subsections:
    - heading:
        label: Scrum Master and Technical Lead @ Nokia
        startdate: February 2024
      points:
      - Lead a DevOps team that has varied between 6 and 12 engineers.
      - Designed and shipped an AI code review agent, rolled out across multiple organizations after a cost analysis against commercial alternatives.
      - Stood up and now lead an internal Infra Team that owns the testing and development labs.
      - Helped build the R&D organization from inception, onboarding new teams and hardening processes as it grew.
      - Drive build quality so QA receives a daily product build that has passed every R&D gate.
      - Built a tool that visualizes AI-assisted code usage, after evaluating git-native approaches to attributing it.
      - Helped develop code review standards and scope and change management processes with QA and product stakeholders.
    - heading:
        label: DevOps Engineer @ Nokia
        startdate: March 2022
        enddate: February 2024
      points:
      - Designed and implemented an internal API that provisions Kubernetes clusters on AWS and Azure via Pulumi.
      - Simplified lab infrastructure and developed automations that cut the operational load of running the labs.
      - Resolved Kubernetes issues and built Kubernetes competence across the developer teams.
    - heading:
        label: Group Lead of SIG for Computer Science
        startdate: February 2020
        enddate: February 2022
      points:
        - Administered the mailing list server processing over 2,000 emails a day.
        - Migrated the dorm's mailing infrastructure to Exchange Online and part of its DNS service to the cloud.
        - Ran mission-critical services including Hyper-V and Kubernetes.
    - heading:
        label: Research Assistant @ Budapest University of Technology and Economics
        startdate: February 2020
        enddate: January 2022
      points:
        - Created a Kubernetes-native system in a 5G network capable of identifying bird song.
        - Adapted the system to an edge-computing environment and identified its performance bottlenecks.
    - heading:
        label: Research Intern @ Ericsson
        startdate: June 2019
        enddate: August 2019
      points:
        - Built a TOSCA parser and integrated it with Ericsson's in-house infrastructure.
        - Deployed Python web applications on Docker-based infrastructure.

  - heading: Skills
    points:
      - Kubernetes and OpenShift, with Helm for packaging and deployment
      - Infrastructure as code with Terraform, Pulumi and Ansible
      - CI/CD with Jenkins, Drone, GitHub Actions and GitLab CI
      - AWS, Azure and on-prem cloud platforms
      - Python for automation, internal tooling and Flask microservices
      - Cisco, Juniper and Arista network administration on Linux-based infrastructure
      - Hyper-V and KVM virtualization
      - AI-assisted development with Cursor, GitHub Copilot, Claude and Perplexity
      - Scrum facilitation and technical leadership of engineering teams

  - heading: Community
    points:
      - Organize Ctrl-Alt-GG, a bilingual Hungarian and English gaming community in Budapest.
      - Run LAN party events of roughly 50 attendees, building the event network, game servers and supporting services.

  - heading: Languages
