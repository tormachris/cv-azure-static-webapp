name: Kristof Torma
address: Budapest, Hungary
email: iam@tormakristof.eu

sections:
  - heading: Summary
    body: Technical Lead and Scrum Master in DevOps and infrastructure at Nokia. Builds greenfield Kubernetes platforms with infrastructure as code, and in-house AI tooling from code review agents to adoption metrics.

  - heading: Experience
    subsections:
    - heading:
        label: Technical Lead and Scrum Master @ Nokia
        startdate: February 2024
      points:
      - Built an in-house AI code review agent, now used by three R&D organizations, at under a third the cost of the commercial alternative.
      - Built a tool that visualizes AI-assisted code usage across the organization.
      - Run a DevOps team of up to 12 engineers, averaging under a week from bug report to resolution and the fastest of the R&D organization's six teams.
      - Established an internal Infra Team that built and owns the testing and development labs.
      - Introduced the CI quality gates that give QA one validated product build per day.
      - Onboarded three teams into a greenfield R&D organization and formalized its development processes as it grew.
      - Co-authored the code review standards and the scope and change management processes with QA and product stakeholders.
    - heading:
        label: DevOps Engineer @ Nokia
        startdate: March 2022
        enddate: February 2024
      points:
      - Designed and implemented an internal API that provisions Kubernetes clusters on AWS and Azure via Pulumi.
      - Cut monthly AWS spend by 36% through a recurring cleanup of unused resources.
      - Built self-service tooling for routine infrastructure tasks, taking the DevOps team out of the critical path for developer requests.
      - Simplified lab infrastructure and developed automations that cut about 7 hours per week of manual maintenance.
      - Resolved Kubernetes issues and built Kubernetes competence across the developer teams.
      - Rewrote the developer documentation so new joiners could set up their environment without pairing with an existing engineer.
    - heading:
        label: Group Lead @ KSZK, Schonherz Dormitory, BME (part-time, alongside MSc)
        startdate: February 2020
        enddate: February 2022
      points:
        - Led KSZK, the roughly 50-member student IT group that runs the dormitory's network and server infrastructure, and introduced DevOps practices to it.
        - Administered the mailing list server processing over 2,000 emails a day and ran production services including Hyper-V and Kubernetes.
        - Migrated the dormitory's mail infrastructure to Exchange Online and its public-facing DNS zones to a managed cloud provider.
    - heading:
        label: Research Assistant @ Budapest University of Technology and Economics (part-time, alongside MSc)
        startdate: February 2020
        enddate: January 2022
      points:
        - Built a Kubernetes-native birdsong identification system over 5G as MSc thesis work, then adapted it to edge computing and profiled its bottlenecks.
    - heading:
        label: Research Intern @ Ericsson
        startdate: June 2019
        enddate: August 2019
      points:
        - Built a TOSCA parser and integrated it with Ericsson's in-house infrastructure.
        - Deployed Python web applications on Docker-based infrastructure.

  - heading: Skills
    points:
      - AI-assisted development and in-house AI tooling built on Claude, Cursor and GitHub Copilot
      - Kubernetes and OpenShift, with Helm for packaging and operators for cluster-native automation
      - Infrastructure as code with Terraform, Pulumi and Ansible
      - CI/CD with Jenkins, Drone, GitHub Actions and GitLab CI
      - AWS, Azure and on-premises platforms
      - Python for automation, internal tooling and Flask microservices
      - Cisco, Juniper and Arista network administration on Linux-based infrastructure
      - Hyper-V and KVM virtualization
      - Scrum facilitation and technical leadership of engineering teams

  - heading: Community
    points:
      - Organize Ctrl-Alt-GG, a bilingual (Hungarian/English) gaming community in Budapest.
      - Run LAN party events of roughly 50 attendees, building the event network, game servers and supporting services.

  - heading: Languages
    points:
      - Hungarian (native)
      - English (fluent)

